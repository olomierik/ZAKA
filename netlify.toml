# ARCSENSE on Netlify (2026-10-03): www.arcsense.site serves the app's files only. Its data and its write
# functions (sign-in, social, uploads) come from the market engine on Railway (engine/src/site/siteApi.ts), so
# nothing runs here per request.

[build]
  command = "bun run build"
  publish = "dist"

# Public by design: every value here ships inside the page itself.
[build.environment]
  BUN_VERSION = "1.3.14"
  VITE_ARCDEX_WS_URL = "wss://arcdex-engine-production.up.railway.app/ws"
  VITE_SUPABASE_URL = "https://jpcaachzumrpccdtajks.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwY2FhY2h6dW1ycGNjZHRhamtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NjE0MzksImV4cCI6MjEwNTUzNzQzOX0.91KuOFaBZp5ChuRgNUTSjhUng291a31fneD7bhFG4Us"
  VITE_ARC_LAUNCHPAD_ADDRESS = "0xEf6a8fdaF0181E19CC2C7575ada4b9c279809a67"
  VITE_ARCDEX_SWAP_ROUTER_ADDRESS = "0xD07583f7DB671521AAcFdA2b4612AD187aA2924e"
  # Netlify's secret scan fails a deploy that ships a value it takes for a secret. These are public by design:
  #   VITE_PRIVY_APP_ID, Privy's app id, which the page needs (the build pack's 05: "the only keys the client may see
  #   are public identifiers (for example PRIVY_APP_ID)"), whether or not it's marked secret in Netlify;
  #   the two Stripe publishable keys inside Privy's SDK (for its card on-ramp): publishable keys are meant for pages.
  # scripts/test-privy.tsx fails when Privy's SDK ships other ones, so this list follows the pinned version.
  # The build's JavaScript heap (2026-10-16): with Privy's SDK the build needs 1.5-2 GB of it (main needed 1-1.5 GB),
  # and the preview deploys failed about a minute in, as a build out of heap does. Measured locally: 3 GB builds with
  # room to spare, at a peak of about 3.1 GB of memory.
  NODE_OPTIONS = "--max-old-space-size=3072"
  SECRETS_SCAN_OMIT_KEYS = "VITE_PRIVY_APP_ID"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "pk_live_hirbpu0cVcLHrjktC9l7fbc9ctjv0SL,pk_test_fqWjXZMSFwloh7orvJsRfjiUHXJqFzI"

# The site's functions live on the engine: here they're a plain 404, so the site's fallback fails fast instead of
# reading the app's HTML as data.
# arcdex.online and www.arcdex.online open the same page on arcsense.site, the primary domain (owner, 2026-10-04). They take
# effect once both names are domain aliases of this Netlify site and their DNS points here (AGENTS.md).
[[redirects]]
  from = "https://arcdex.online/*"
  to = "https://arcsense.site/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.arcdex.online/*"
  to = "https://arcsense.site/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://arcdex.online/*"
  to = "https://arcsense.site/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.arcdex.online/*"
  to = "https://arcsense.site/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

# A code file that isn't there (an old build's, asked for by a page left open across a deploy) is a 404, not the app's
# HTML: the page then reloads to the new version at once (lib/chunkReload.ts). Files that exist are served as usual
# (no force).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/arcdex"
  to = "/arcdex.html"
  status = 200

[[redirects]]
  from = "/arcdex/*"
  to = "/arcdex.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (2026-10-15, docs/REPO_MAP.md finding 2; the build pack's 04 §3). The in-page trading wallet keeps an
# encrypted key in this origin's storage, so the policy's job is to keep foreign scripts out:
#   script-src   this site's files only, plus two hashed inline pieces of index.html: the theme script and the fonts'
#                onload="this.media='all'" ('unsafe-hashes' allows that exact handler and nothing else).
#                Edit either and its hash changes: `bun scripts/check-csp.ts` fails until this line is updated.
#                Also Cloudflare Turnstile (challenges.cloudflare.com), the bot check Privy's sign-in shows when the
#                Privy app has it on (2026-10-16, privy/PrivyRoot.tsx). And MoonPay's web SDK
#                (static.moonpay.com), loaded only when someone buys USDC with a card (2026-10-18, CardDeposit.tsx).
#   connect-src  any https/wss host: the app talks to many chains' RPCs (and ones the user picks in RPC settings),
#                Relay, Across, Hyperliquid, Supabase and the engine. Narrowing it is a later step.
#   frame-src    https: wallet and on-ramp frames (WalletConnect, Coinbase, Circle), Privy's auth.privy.io (its wallets and
#                key export live in that frame, on Privy's origin) and Turnstile.
# No one may frame the site (frame-ancestors, X-Frame-Options); HSTS keeps it on https.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-/x7mTaIbxP1qpCmCznmB0+A1bI4XC1YTQ0tI1YCtvKw=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=' https://challenges.cloudflare.com https://static.moonpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), serial=(), hid=(), bluetooth=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# The service worker that shows pushed alerts (public/sw.js): always checked for a newer copy, so an update reaches
# every browser at once.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The app's code and styles (2026-10-17): Vite names each file by its content, so a file never changes under its name.
# They were served with max-age=0, must-revalidate: every visit asked again for every file, ~0.4-1.4 s each from Dar es
# Salaam (docs/COMPETITORS-2026-10-17.md). Now the browser keeps them for a year and a return visit starts at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

