# Checks on every pull request and every push to main (docs/REPO_MAP.md finding 6; the build pack's 04 §3).
# The same checks run locally with `bun run check` (scripts/check.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (typecheck, security headers, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Security headers (source and built HTML)
        run: bun scripts/check-csp.ts
      - name: Trade switch (site side)
        run: bun scripts/test-trade-switch.ts
      - name: Fees (level, fee wallet, owner control)
        run: bun scripts/test-fees.ts
      - name: Withdraw limits
        run: bun scripts/test-withdraw-policy.ts
      - name: Wallets card balances
        run: bun scripts/test-chain-balances.ts
      - name: Jupiter (orders, transactions, provider choice)
        run: bun scripts/test-jupiter.ts
      - name: Safety rating on every buy path
        run: bun scripts/test-buy-risk.tsx
      - name: Alerts by push (site side)
        run: bun scripts/test-push.ts
      - name: Privy sign-in
        run: bun scripts/test-privy.tsx
      - name: App shell
        run: bun scripts/test-app-shell.ts
      - name: Social layer (independent PnL check, comments as text, bans, flag)
        run: bun scripts/test-social.tsx
      - name: Wallet reconnect on load
        run: bun scripts/test-reconnect.tsx
      - name: Trade forms (one field, Details drawer)
        run: bun scripts/test-trade-details.tsx
      - name: Chart framing (opening timeframe, even time)
        run: bun scripts/test-chart-frame.ts
      - name: DexScreener data, Trending lane, launchpad icons
        run: bun scripts/test-dex-data.ts
      - name: Anti-MEV (Jito)
        run: bun scripts/test-jito.ts
      - name: Anti-MEV on BNB Chain (private RPC sends)
        run: bun scripts/test-bsc-private.ts
      - name: Paying from Ethereum, Base or Arbitrum (Relay quote checks)
        run: bun scripts/test-xevm.ts
      - name: Fast buys (approval and swap back to back)
        run: bun scripts/test-fast-buy.ts
      - name: Wallet tracker (addresses, following, routes)
        run: bun scripts/test-wallet-tracker.ts
      - name: Copy trading from the user's own wallet (sizing, checks, storage)
        run: bun scripts/test-copy-trade.ts

  engine:
    name: Engine (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The engine's own packages (engine/package.json: the algo agent's Anthropic SDK and zod), as Railway installs them.
      - name: Install the engine's packages
        working-directory: engine
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: engine
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bun test engine/test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0 (checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan the files
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact
      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A new branch's first push has no "before" commit: scan its last 50 commits instead.
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="HEAD~50..HEAD" ;; esac
          git rev-parse -q --verify "${RANGE%%..*}^{commit}" >/dev/null || RANGE="HEAD~50..HEAD"
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact --log-opts="$RANGE"
