name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy register --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy login --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy get-balance --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy send-usdc --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy withdraw --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy tx-status --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Set Edge Function Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            CIRCLE_DEVELOPER_CONTROLLED_API_KEY="${{ secrets.CIRCLE_DEVELOPER_CONTROLLED_API_KEY }}" \
            CIRCLE_ENTITY_SECRET="${{ secrets.CIRCLE_ENTITY_SECRET }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
