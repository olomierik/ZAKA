# Railway: the ARCDEX market engine (engine/). The website deploys on Vercel.
# Only engine files trigger a redeploy — website commits don't restart it.

[build]
builder = "DOCKERFILE"
dockerfilePath = "engine/Dockerfile"
watchPatterns = ["engine/**", "api/_arcLogs.ts", "api/_arcSwaps.ts", "api/_curves.ts", "api/_marketProtocol.ts", "api/_quantProtocol.ts", "api/_supabaseAdmin.ts", "api/_argusBonded.ts", "api/_argusCore.ts", "api/_curveIndex.ts", "api/_curvesRoute.ts", "api/_geckoterminal.ts", "api/_holdersCore.ts", "api/_launchpadCore.ts", "api/_launchpads.ts", "api/argus.ts", "api/dex.ts", "api/gecko.ts", "api/holders.ts", "api/index-trades.ts", "api/launchpad.ts", "api/radar.ts", "api/_rhCore.ts", "api/rhmarket.ts", "api/_solCore.ts", "api/solmarket.ts", "api/_bscCore.ts", "api/bscmarket.ts", "api/chainsearch.ts", "api/_session.ts", "api/session.ts", "api/social.ts", "api/upload.ts", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
